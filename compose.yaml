services:
  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - "./web:/usr/share/nginx/html:ro"
      - "./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
    depends_on:
      - api

  api:
    build:
      context: ./api
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /app/storage
      REDACTION_URL: http://privacy:8100
    volumes:
      - "api-data:/app/storage"
    depends_on:
      privacy:
        condition: service_healthy

  privacy:
    build: ./privacy-service
    restart: unless-stopped
    environment:
      PRIVACY_OBJECT_CONFIDENCE: ${PRIVACY_OBJECT_CONFIDENCE:-0.35}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

volumes:
  api-data:
