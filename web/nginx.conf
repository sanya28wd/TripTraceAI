server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /v1/ {
        # nginx defaults to 1 MB. The API enforces the real 5 MB image limit and returns a
        # friendly 413, so this only needs to be slightly larger.
        client_max_body_size 6m;
        proxy_pass http://api:8000;
    }

    location = / {
        return 302 /passenger/;
    }

    location = /passenger/ {
        try_files /passenger.html =404;
    }

    location = /driver/ {
        try_files /driver.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
