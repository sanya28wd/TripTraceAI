openapi: 3.0.3
info:
  title: TripTrace AI Phase 2 Mock API
  version: 2.0.0
  description: Synthetic in-memory passenger and driver-alert prototype. Restarting the API resets state.
paths:
  /health:
    get:
      responses:
        '200': { description: API available }
  /v1/mock/cases/{tripId}:
    get:
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Passenger-safe case projection
          content: { application/json: { schema: { $ref: '#/components/schemas/PassengerCase' } } }
        '404': { description: Unknown trip }
  /v1/mock/claims:
    post:
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [tripId], properties: { tripId: { type: string } } } } }
      responses:
        '200':
          description: Passenger-safe result; creates an alert only when safe evidence passes.
          content: { application/json: { schema: { $ref: '#/components/schemas/PassengerCase' } } }
  /v1/mock/driver/session:
    get:
      responses:
        '200':
          description: Fixed demo driver session
          content: { application/json: { schema: { $ref: '#/components/schemas/DriverSession' } } }
  /v1/mock/driver/alerts:
    get:
      responses:
        '200':
          description: Alerts assigned to the demo driver, newest first
          content: { application/json: { schema: { type: object, required: [alerts], properties: { alerts: { type: array, items: { $ref: '#/components/schemas/DriverAlert' } } } } } }
  /v1/mock/driver/alerts/{alertId}:
    get:
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        '200': { description: Driver-safe alert detail, content: { application/json: { schema: { $ref: '#/components/schemas/DriverAlert' } } } }
        '404': { description: Alert is not assigned to the session }
  /v1/mock/driver/alerts/{alertId}/read:
    post:
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        '200': { description: Read state recorded, content: { application/json: { schema: { $ref: '#/components/schemas/DriverAlert' } } } }
  /v1/mock/driver/alerts/{alertId}/actions:
    post:
      parameters:
        - $ref: '#/components/parameters/AlertId'
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [action], properties: { action: { type: string, enum: [secure, no_item, ask_operations] } } } } }
      responses:
        '200': { description: Completed alert, content: { application/json: { schema: { $ref: '#/components/schemas/DriverAlert' } } } }
        '409': { description: Already completed, invalid state, or unsafe evidence }
components:
  parameters:
    TripId: { name: tripId, in: path, required: true, schema: { type: string } }
    AlertId: { name: alertId, in: path, required: true, schema: { type: string } }
  schemas:
    PassengerCase:
      type: object
      required: [tripId, caseId, status, language, responseType, safePassengerMessage]
      properties:
        tripId: { type: string }
        caseId: { type: string }
        status: { type: string }
        language: { type: string, enum: [en, ar] }
        responseType: { type: string }
        safePassengerMessage: { type: string }
        clarificationQuestion: { type: string, nullable: true }
    DriverSession:
      type: object
      properties:
        driver: { type: object, properties: { driverId: { type: string }, name: { type: string } } }
        vehicle: { type: object, properties: { vehicleId: { type: string }, label: { type: string } } }
    DriverAlert:
      type: object
      required: [alertId, caseId, tripId, createdAt, updatedAt, alertStatus, caseStatus, detectedItem, allowedActions]
      properties:
        alertId: { type: string }
        caseId: { type: string }
        tripId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time, nullable: true }
        alertStatus: { type: string, enum: [new, in_progress, completed] }
        caseStatus: { type: string }
        detectedItem:
          type: object
          properties:
            category: { type: string }
            colour: { type: string }
            seatAreaHint: { type: string }
            imageUrl: { type: string }
            imageAlt: { type: string }
        allowedActions: { type: array, items: { type: string, enum: [secure, no_item, ask_operations] } }
        outcomeMessage: { type: string, nullable: true }
