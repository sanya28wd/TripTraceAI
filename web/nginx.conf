server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /v1/ {
        proxy_pass http://api:8000;
    }

    location = / {
        return 302 /passenger/;
    }

    location = /passenger/ {
        try_files /passenger.html =404;
    }

    location = /driver/ {
        try_files /driver.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
