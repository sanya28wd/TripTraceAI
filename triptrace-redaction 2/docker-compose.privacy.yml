# Merge into your docker-compose.yml (I have not seen it). Key points:
#  * the privacy service publishes NO ports, so only containers on the compose network (the API) can reach it;
#  * the API only starts once the gateway reports healthy (/health is 503 until both models load).
services:
  privacy:
    build: ./privacy-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  api:
    environment:
      REDACTION_URL: http://privacy:8100
    depends_on:
      privacy:
        condition: service_healthy
